<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Online - Cronograma de Baús</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121214;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #ffb800;
    }

    p.subtitle {
      margin-bottom: 20px;
      color: #a8a8b3;
      font-size: 0.9rem;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .chest-card {
      background-color: #202024;
      border: 1px solid #323238;
      border-radius: 8px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .chest-card:hover {
      transform: translateY(-2px);
      border-color: #ffb800;
    }

    .chest-info h3 {
      color: #f7f7f8;
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .chest-info p {
      color: #a8a8b3;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .badge-black { background-color: #714859; color: #ffadad; }
    .badge-red { background-color: #632626; color: #ff8e8e; }
    .badge-yellow { background-color: #5c5324; color: #ffe36e; }

    .chest-timer {
      text-align: right;
    }

    .timer-time {
      font-size: 1.4rem;
      font-weight: bold;
      color: #00e676;
    }

    .timer-next {
      font-size: 0.8rem;
      color: #8d8d99;
    }
  </style>
</head>
<body>

  <h1>Baús do Mapa - Albion Online</h1>
  <p class="subtitle">Horários previstos em ordem cronológica (Calculado em tempo real)</p>

  <div class="container" id="chest-list">
    <!-- Os cards de baús serão injetados via JS -->
  </div>

  <script>
    // Base de dados simulada com baús de rotinas fixas (Horários UTC)
    const chestsData = [
      { location: "Astolat (Outlands)", zone: "Black Zone", type: "Baú Lendário Grande", spawnTimesUTC: ["00:00", "04:00", "08:00", "12:00", "16:00", "20:00"] },
      { location: "Camlann (Continente Real)", zone: "Red Zone", type: "Baú de Facção / Boss", spawnTimesUTC: ["02:00", "06:00", "10:00", "14:00", "18:00", "22:00"] },
      { location: "Inis Mon (Outlands)", zone: "Black Zone", type: "Baú Raro Grande", spawnTimesUTC: ["01:30", "07:30", "13:30", "19:30"] },
      { location: "Coedth Mor (Outlands)", zone: "Black Zone", type: "Baú Incomum", spawnTimesUTC: ["03:00", "11:00", "19:00"] },
      { location: "Precipício de Morgana", zone: "Red Zone", type: "Baú de Tesouro", spawnTimesUTC: ["05:00", "17:00"] }
    ];

    function getNextSpawnTime(timeStrings) {
      const now = new Date();
      const currentUTCMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
      const currentUTCSeconds = now.getUTCSeconds();

      let nextSpawnDate = null;
      let minDiff = Infinity;

      timeStrings.forEach(timeStr => {
        const [hours, minutes] = timeStr.split(':').map(Number);
        const spawnUTCMinutes = hours * 60 + minutes;

        let diffMinutes = spawnUTCMinutes - currentUTCMinutes;
        
        // Se o horário de hoje já passou, adiciona 24h (1440 min)
        if (diffMinutes < 0 || (diffMinutes === 0 && currentUTCSeconds > 0)) {
          diffMinutes += 1440;
        }

        if (diffMinutes < minDiff) {
          minDiff = diffMinutes;
          // Define objeto de data para o próximo surgimento
          const target = new Date(now);
          target.setUTCMinutes(now.getUTCMinutes() + diffMinutes);
          target.setUTCSeconds(0);
          nextSpawnDate = target;
        }
      });

      const remainingMs = nextSpawnDate - now;
      return {
        nextSpawnDate,
        remainingMs,
        formattedRemaining: formatMs(remainingMs)
      };
    }

    function formatMs(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getBadgeClass(zone) {
      if (zone.includes("Black")) return "badge-black";
      if (zone.includes("Red")) return "badge-red";
      return "badge-yellow";
    }

    function updateChestsUI() {
      // Processa e ordena cronologicamente pelo tempo restante mais curto
      const processedChests = chestsData.map(chest => {
        const spawnData = getNextSpawnTime(chest.spawnTimesUTC);
        return { ...chest, ...spawnData };
      }).sort((a, b) => a.remainingMs - b.remainingMs);

      const listContainer = document.getElementById('chest-list');
      listContainer.innerHTML = '';

      processedChests.forEach(chest => {
        const localTimeStr = chest.nextSpawnDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const card = document.createElement('div');
        card.className = 'chest-card';
        card.innerHTML = `
          <div class="chest-info">
            <h3>${chest.location}</h3>
            <p>${chest.type}</p>
            <span class="badge ${getBadgeClass(chest.zone)}">${chest.zone}</span>
          </div>
          <div class="chest-timer">
            <div class="timer-time">${chest.formattedRemaining}</div>
            <div class="timer-next">Nasce às ${localTimeStr} (Horário Local)</div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // Atualiza a cada segundo
    setInterval(updateChestsUI, 1000);
    
    // Execução inicial
    updateChestsUI();
  </script>
</body>
</html>
